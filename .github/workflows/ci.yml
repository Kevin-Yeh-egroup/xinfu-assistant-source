name: 測試

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安裝中文字型
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 安裝測試工具
        run: npm ci && npx playwright install --with-deps chromium
      - name: 建置
        run: npm run build
      - name: 端對端測試
        run: npm test
      - name: 測試失敗時保留截圖
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: .test-output/
          retention-days: 7
